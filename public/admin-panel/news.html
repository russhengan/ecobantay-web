<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="assets/ecobantay-icon.png">
    <title>EcoBantay Admin - News</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
      }
      #sidebar {
        min-height: 100vh;
        width: 240px;
        background-image: url("assets/background.png");
        background-size: cover;
        background-position: center;
        color: white;
        position: fixed;
      }
      #sidebar .nav-link {
        color: white;
        font-weight: 500;
        padding: 10px 20px;
      }
      #sidebar .nav-link:hover,
      #sidebar .nav-link.active {
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 5px;
      }
      .dashboard-wrapper {
        margin-left: 240px;
        padding: 2rem;
        min-height: 100vh;
      }
      .logout-btn {
        width: 100%;
        margin-top: auto;
      }
      .avatar {
        width: 60px;
        height: 60px;
        background-color: white;
        color: #2e8b57;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin: 0 auto 10px;
      }
      .img-preview {
        max-width: 100%;
        height: auto;
        border-radius: 6px;
        margin-top: 10px;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
      }
      .card-title {
        font-size: 1.25rem;
        font-weight: 600;
      }
      .card-text {
        font-size: 0.95rem;
      }
      .btn-success {
        background-color: #2e8b57;
        border: none;
      }
      .btn-success:hover {
        background-color: #276b47;
      }
      .section-title {
        background: #c8f7c5;
        padding: 12px 18px;
        border-left: 6px solid #53b052;
        border-radius: 8px;
        font-size: 1.3rem;
        font-weight: bold;
        margin-bottom: 20px;
      }
    </style>
  </head>

  <body>
    <div class="d-flex">

      <!-- Sidebar -->
      <div id="sidebar" class="d-flex flex-column p-3">
        <div class="text-center mb-4">
          <div class="avatar">👤</div>
          <strong id="adminName">Loading...</strong><br />
          <small>Admin</small>
        </div>

        <ul class="nav nav-pills flex-column mb-auto">
          <li><a href="index.html" class="nav-link">Dashboard</a></li>
          <li><a href="users.html" class="nav-link">Users</a></li>
          <li><a href="employees.html" class="nav-link">Employees</a></li>
          <li><a href="request.html" class="nav-link">Requests</a></li>
          <li><a href="reports.html" class="nav-link">Reports</a></li>
          <li><a href="news.html" class="nav-link active">News</a></li>
          <li><a href="trucklogs.html" class="nav-link">Truck Logs</a></li>
          <li><a href="trucks.html" class="nav-link">Trucks</a></li>
          <li><a href="schedule.html" class="nav-link">Scheduling</a></li>
          <li><a href="dispatch.html" class="nav-link">Dispatch</a></li>
          <li><a href="generate-qr.html" class="nav-link">QR Code Generation</a></li>
        </ul>

        <button class="btn btn-light logout-btn">Log Out</button>
      </div>

      <!-- Main -->
      <div class="dashboard-wrapper container-fluid">

        <div class="card border-0 shadow-sm p-4 rounded-4 mb-5">
          <h4 class="mb-4">📝 Create New News</h4>

          <form id="newsForm" enctype="multipart/form-data">
            <div class="mb-3">
              <label class="form-label">Title</label>
              <input type="text" class="form-control" id="newsTitle" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Content</label>
              <textarea class="form-control" id="newsContent" rows="5" required></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Upload Image</label>
              <input type="file" class="form-control" id="newsImage" accept="image/*" />
              <img id="previewImage" class="img-preview d-none" />
            </div>

            <button type="submit" class="btn btn-success">Post News</button>
          </form>
        </div>

        <h4 class="mb-3">📌 Recent News</h4>
        <div id="newsList" class="row row-cols-1 row-cols-md-2 g-4"></div>

      </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow">
          <div class="modal-header bg-light border-0 rounded-top-4">
            <h5 class="modal-title fw-semibold">✏️ Edit News</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <form id="editNewsForm">
            <div class="modal-body px-4 py-3">
              <input type="hidden" id="editNewsId" />
              <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" class="form-control" id="editTitle" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Content</label>
                <textarea class="form-control" id="editContent" rows="5" required></textarea>
              </div>
            </div>
            <div class="modal-footer bg-light border-0 d-flex justify-content-end gap-2 rounded-bottom-4">
              <button type="submit" class="btn btn-primary">💾 Save Changes</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const token = localStorage.getItem("adminToken");
      const apiBase = "https://ecobantay-backend.onrender.com/api/news";

      if (!token) {
        alert("Unauthorized. Redirecting to login...");
        window.location.href = "login.html";
      }

      // Fetch Admin Name
      fetch("https://ecobantay-backend.onrender.com/api/admin/profile", {
        headers: { Authorization: `Bearer ${token}` },
      })
        .then(res => res.json())
        .then(data => {
          document.getElementById("adminName").innerText =
            data.name || `${data.firstName} ${data.lastName}` || "Admin";
        })
        .catch(() => {
          document.getElementById("adminName").innerText = "Admin";
        });

      // Logout
      document.querySelector(".logout-btn").addEventListener("click", () => {
        localStorage.removeItem("adminToken");
        window.location.href = "login.html";
      });

      // Image preview
      document.getElementById("newsImage").addEventListener("change", (e) => {
        const file = e.target.files[0];
        const preview = document.getElementById("previewImage");

        if (file) {
          const reader = new FileReader();
          reader.onload = () => {
            preview.src = reader.result;
            preview.classList.remove("d-none");
          };
          reader.readAsDataURL(file);
        }
      });

      // Create News
      document.getElementById("newsForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const title = document.getElementById("newsTitle").value.trim();
        const content = document.getElementById("newsContent").value.trim();
        const imageFile = document.getElementById("newsImage").files[0];

        const formData = new FormData();
        formData.append("title", title);
        formData.append("content", content);
        if (imageFile) formData.append("image", imageFile);

        const res = await fetch(apiBase, {
          method: "POST",
          headers: { Authorization: `Bearer ${token}` },
          body: formData,
        });

        if (res.ok) {
          alert("✅ News created successfully!");
          document.getElementById("newsForm").reset();
          document.getElementById("previewImage").classList.add("d-none");
          loadNews();
        } else {
          alert("❌ Failed to create news.");
        }
      });

      // Load all news
      async function loadNews() {
        const res = await fetch(apiBase);
        const data = await res.json();

        const container = document.getElementById("newsList");
        container.innerHTML = "";

        data.forEach((item) => {
          container.innerHTML += `
            <div class="col">
              <div class="card shadow-sm">
                ${
                  item.imageUrl
                    ? `<img src="https://ecobantay-backend.onrender.com${item.imageUrl}" class="card-img-top" alt="News Image">`
                    : ""
                }
                <div class="card-body">
                  <h5 class="card-title">${item.title}</h5>
                  <p class="card-text">${item.content}</p>
                  <small class="text-muted">Posted on ${new Date(item.createdAt).toLocaleString()}</small>

                  <div class="mt-3 d-flex justify-content-end gap-2">
                    <button class="btn btn-sm btn-outline-primary" onclick="editNews('${item._id}')">
                      <i class="bi bi-pencil-square"></i> Edit
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteNews('${item._id}')">
                      <i class="bi bi-trash"></i> Delete
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `;
        });
      }

      loadNews();

      // Delete News
      async function deleteNews(id) {
        if (!confirm("Are you sure you want to delete this news?")) return;

        const res = await fetch(`${apiBase}/${id}`, { method: "DELETE" });
        if (res.ok) {
          alert("🗑️ News deleted!");
          loadNews();
        } else {
          alert("❌ Failed to delete news.");
        }
      }

      // Open Edit Modal + Prefill
      async function editNews(id) {
        const res = await fetch(`${apiBase}/${id}`);
        const data = await res.json();

        document.getElementById("editNewsId").value = data._id;
        document.getElementById("editTitle").value = data.title;
        document.getElementById("editContent").value = data.content;

        new bootstrap.Modal(document.getElementById("editModal")).show();
      }

      // Save Edited News
      document.getElementById("editNewsForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const id = document.getElementById("editNewsId").value;
        const title = document.getElementById("editTitle").value.trim();
        const content = document.getElementById("editContent").value.trim();

        const res = await fetch(`${apiBase}/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, content }),
        });

        if (res.ok) {
          alert("✅ News updated!");
          loadNews();
          bootstrap.Modal.getInstance(document.getElementById("editModal")).hide();
        } else {
          alert("❌ Failed to update news.");
        }
      });
    </script>
  </body>
</html>
