<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="assets/ecobantay-icon.png">
    <title>EcoBantay - Users</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
      }
      #sidebar {
        min-height: 100vh;
        width: 240px;
        background-image: url("assets/background.png");
        background-size: cover;
        background-position: center;
        color: white;
        position: fixed;
      }
      #sidebar .nav-link {
        color: white;
        font-weight: 500;
        padding: 10px 20px;
      }
      #sidebar .nav-link:hover,
      #sidebar .nav-link.active {
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 5px;
      }
      .dashboard-wrapper {
        margin-left: 240px;
        padding: 2rem;
      }
      .avatar {
        width: 60px;
        height: 60px;
        background-color: white;
        color: #2e8b57;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin: 0 auto 10px;
      }
      .logout-btn {
        width: 100%;
        margin-top: auto;
      }
      .section-title {
        background: #c8f7c5;
        padding: 12px 18px;
        border-left: 6px solid #53b052;
        border-radius: 8px;
        font-size: 1.3rem;
        font-weight: bold;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="d-flex">
      <!-- Sidebar -->
      <div id="sidebar" class="d-flex flex-column p-3">
        <div class="text-center mb-4">
          <div class="avatar">👤</div>
          <strong id="adminName">Loading...</strong><br />
          <small>Admin</small>
        </div>
        <ul class="nav nav-pills flex-column mb-auto">
          <li><a href="index.html" class="nav-link">Dashboard</a></li>
          <li><a href="users.html" class="nav-link active">Users</a></li>
          <li><a href="employees.html" class="nav-link">Employees</a></li>
          <li><a href="request.html" class="nav-link">Requests</a></li>
          <li><a href="reports.html" class="nav-link">Reports</a></li>
          <li><a href="news.html" class="nav-link">News</a></li>
          <li><a href="trucklogs.html" class="nav-link ">Truck Logs</a></li>
          <li><a href="trucks.html" class="nav-link ">Trucks</a></li>
          <li> <a href="schedule.html" class="nav-link">Scheduling</a></li>
          <li> <a href="dispatch.html" class="nav-link">Dispatch</a></li>
          <li><a href="generate-qr.html" class="nav-link">QR Code Generation</a></li>


        </ul>
        <button class="btn btn-light logout-btn">Log Out</button>
      </div>

      <!-- Main Content -->
      <div class="dashboard-wrapper container-fluid">
      <div class="section-title">All Registered User</div>

        <input
          type="text"
          id="searchUser"
          class="form-control mb-3"
          placeholder="Search by name, email or contact"
        />
        <table
          class="table table-bordered table-hover table-striped align-middle"
        >
          <thead class="table-success">
            <tr>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Email</th>
              <th>Contact</th>
              <th>Gender</th>
              <th>Address</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="userTable"></tbody>
        </table>
      </div>
    </div>

    <div class="modal fade" id="editUserModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="editUserForm">
            <div class="modal-header">
              <h5 class="modal-title">Edit Resident</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" name="_id" />
              <input
                type="text"
                name="firstName"
                class="form-control mb-2"
                placeholder="First Name"
                required
              />
              <input
                type="text"
                name="lastName"
                class="form-control mb-2"
                placeholder="Last Name"
                required
              />
              <input
                type="email"
                name="email"
                class="form-control mb-2"
                placeholder="Email"
                required
              />
              <input
                type="text"
                name="contactNumber"
                class="form-control mb-2"
                placeholder="Contact"
                required
              />
              <input
                type="text"
                name="gender"
                class="form-control mb-2"
                placeholder="Gender"
                required
              />
              <input
                type="text"
                name="address"
                class="form-control mb-2"
                placeholder="Address"
                required
              />
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-primary">
                Save Changes
              </button>
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- Bootstrap JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const token = localStorage.getItem("adminToken");
      if (!token) {
        alert("Unauthorized. Redirecting to login...");
        window.location.href = "login.html";
      }

      // Fetch Admin Name
      fetch("http://z:5000/api/admin/profile", {
        headers: { Authorization: `Bearer ${token}` },
      })
        .then((res) => res.json())
        .then((data) => {
          document.getElementById("adminName").innerText = data.name || "Admin";
        });

      // Fetch Users
      let allUsers = [];

      fetch("https://ecobantay-backend.onrender.com/api/admin/users", {
        headers: { Authorization: `Bearer ${token}` },
      })
        .then((res) => res.json())
        .then((data) => {
          allUsers = data.users; // ✅ store users globally for search to work
          renderUserTable(allUsers); // ✅ reuse the render function
        });

      function openEditModal(userId) {
        fetch(`https://ecobantay-backend.onrender.com/api/admin/user/${userId}`, {
          headers: { Authorization: `Bearer ${token}` },
        })
          .then((res) => res.json())
          .then((user) => {
            const form = document.getElementById("editUserForm");
            form._id.value = user._id;
            form.firstName.value = user.firstName;
            form.lastName.value = user.lastName;
            form.email.value = user.email;
            form.contactNumber.value = user.contactNumber;
            form.gender.value = user.gender;
            form.address.value = user.address;
            new bootstrap.Modal(
              document.getElementById("editUserModal")
            ).show();
          });
      }

      document
        .getElementById("editUserForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const formData = new FormData(this);
          const payload = Object.fromEntries(formData.entries());

          fetch(
            `https://ecobantay-backend.onrender.com/api/admin/update-user/${payload._id}`,
            {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify(payload),
            }
          )
            .then((res) => res.json())
            .then((data) => {
              alert(data.message || "User updated.");
              bootstrap.Modal.getInstance(
                document.getElementById("editUserModal")
              ).hide();
              location.reload(); // Refresh the table
            });
        });

      function deleteUser(userId) {
        if (!confirm("Are you sure you want to delete this user?")) return;

        fetch(`https://ecobantay-backend.onrender.com/api/admin/delete-user/${userId}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        })
          .then((res) => res.json())
          .then((data) => {
            alert(data.message || "User deleted.");
            location.reload();
          });
      }

      function renderUserTable(users) {
        const table = document.getElementById("userTable");
        table.innerHTML = "";

        users.forEach((user) => {
          const row = `
      <tr>
        <td>${user.firstName}</td>
        <td>${user.lastName}</td>
        <td>${user.email}</td>
        <td>${user.contactNumber || "-"}</td>
        <td>${user.gender || "-"}</td>
        <td>${user.address || "-"}</td>
        <td>
          <button class="btn btn-warning btn-sm" onclick="openEditModal('${
            user._id
          }')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteUser('${
            user._id
          }')">Delete</button>
        </td>
      </tr>
    `;
          table.innerHTML += row;
        });
      }

      document
        .getElementById("searchUser")
        .addEventListener("input", function () {
          const query = this.value.toLowerCase();

          const filtered = allUsers.filter((user) => {
            const fullName = `${user.firstName} ${user.lastName}`.toLowerCase();
            return (
              fullName.includes(query) ||
              user.email.toLowerCase().includes(query) ||
              (user.contactNumber || "").includes(query)
            );
          });

          renderUserTable(filtered);
        });
    </script>
  </body>
</html>
