<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="assets/ecobantay-icon.png">

    <title>EcoBantay - Create Driver</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
      }
      #sidebar {
        min-height: 100vh;
        width: 240px;
        background-image: url("assets/background.png");
        background-size: cover;
        background-position: center;
        color: white;
        position: fixed;
      }
      #sidebar .nav-link {
        color: white;
        font-weight: 500;
        padding: 10px 20px;
      }
      #sidebar .nav-link:hover,
      #sidebar .nav-link.active {
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 5px;
      }
      .dashboard-wrapper {
        margin-left: 240px;
        padding: 2rem;
      }
      .avatar {
        width: 60px;
        height: 60px;
        background-color: white;
        color: #2e8b57;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin: 0 auto 10px;
      }
      .logout-btn {
        width: 100%;
        margin-top: auto;
      }

      .section-title {
        background: #c8f7c5;
        padding: 12px 18px;
        border-left: 6px solid #53b052;
        border-radius: 8px;
        font-size: 1.3rem;
        font-weight: bold;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="d-flex">
      <div id="sidebar" class="d-flex flex-column p-3">
        <div class="text-center mb-4">
          <div class="avatar">👤</div>
          <strong id="adminName">Loading...</strong><br />
          <small>Admin</small>
        </div>
        <ul class="nav nav-pills flex-column mb-auto">
          <li><a href="index.html" class="nav-link">Dashboard</a></li>
          <li><a href="users.html" class="nav-link">Users</a></li>
          <li><a href="employees.html" class="nav-link">Employees</a></li>
          <li><a href="request.html" class="nav-link">Requests</a></li>
          <li><a href="reports.html" class="nav-link">Reports</a></li>
          <li><a href="drivers.html" class="nav-link ">Drivers</a></li>
          <li><a href="news.html" class="nav-link ">News</a></li>
          

        </ul>
        <button class="btn btn-light logout-btn">Log Out</button>
      </div>

      <!-- Main Content -->
      <div class="dashboard-wrapper container-fluid">
      <div class="section-title">Create Driver Account</div>

        <!-- Driver Creation Form -->
        <form id="createDriverForm" class="col-md-6">
          <input type="text" name="firstName" class="form-control mb-2" placeholder="First Name" required />
          <input type="text" name="lastName" class="form-control mb-2" placeholder="Last Name" required />
          <input type="email" name="email" class="form-control mb-2" placeholder="Email" required />
          <input type="text" name="contactNumber" class="form-control mb-2" placeholder="Contact Number" pattern="\d{11}" maxlength="11" required />
          <input type="password" name="password" class="form-control mb-2" placeholder="Password" required />
          <input type="password" name="confirmPassword" class="form-control mb-2" placeholder="Confirm Password" required />

          <select class="form-control mb-2" name="status" required>
            <option value="" disabled selected>Select Status</option>
            <option value="available">Available</option>
            <option value="unavailable">Unavailable</option>
          </select>

          <select name="gender" class="form-control mb-2" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>

          <input type="text" name="city" class="form-control mb-2" placeholder="City" required />
          <input type="text" name="barangay" class="form-control mb-2" placeholder="Barangay" required />
          <input type="text" name="address" class="form-control mb-3" placeholder="Full Address" required />

          <button type="submit" class="btn btn-primary">Create</button>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const token = localStorage.getItem("adminToken");
      if (!token) {
        alert("Unauthorized. Redirecting to login...");
        window.location.href = "login.html";
      }

      fetch("https://ecobantay-backend.onrender.com/api/admin/profile", {
        headers: { Authorization: `Bearer ${token}` },
      })
        .then((res) => res.json())
        .then((data) => {
          document.getElementById("adminName").innerText = data.name || "Admin";
        });

      document.getElementById("createDriverForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const formData = new FormData(this);
        const payload = Object.fromEntries(formData.entries());

        if (payload.password !== payload.confirmPassword) {
          alert("Passwords do not match.");
          return;
        }
        delete payload.confirmPassword;

        fetch("https://ecobantay-backend.onrender.com/api/admin/create-driver", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify(payload),
        })
          .then((res) => {
            if (!res.ok) throw new Error("Failed to create driver");
            return res.json();
          })
          .then((data) => {
            alert(data.message);
            this.reset();
          })
          .catch((err) => {
            console.error(err);
            alert("Failed to create driver.");
          });
      });

      document.querySelector(".logout-btn").addEventListener("click", () => {
        localStorage.removeItem("adminToken");
        window.location.href = "login.html";
      });
    </script>
  </body>
</html>
