<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="assets/ecobantay-icon.png">
    <title>Generate QR Code - EcoBantay Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
      }
      #sidebar {
        min-height: 100vh;
        width: 240px;
        background-image: url("assets/background.png");
        background-size: cover;
        background-position: center;
        color: white;
        position: fixed;
      }
      #sidebar .nav-link {
        color: white;
        font-weight: 500;
        padding: 10px 20px;
      }
      #sidebar .nav-link:hover,
      #sidebar .nav-link.active {
        background-color: rgba(0, 0, 0, 0.3);
        border-radius: 5px;
      }
      .dashboard-wrapper {
        margin-left: 240px;
        padding: 2rem;
      }
      .avatar {
        width: 60px;
        height: 60px;
        background-color: white;
        color: #2e8b57;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin: 0 auto 10px;
      }
      .logout-btn {
        width: 100%;
        margin-top: auto;
      }
      .form-container {
        max-width: 600px;
        background-color: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        margin: auto;
      }
      #qrPreview {
        margin-top: 30px;
        text-align: center;
      }
      #qrImage {
        max-width: 300px;
        margin-top: 10px;
      }
      .history-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
    </style>
  </head>

  <body>
    <div class="d-flex">
      <!-- Sidebar -->
      <div id="sidebar" class="d-flex flex-column p-3">
        <div class="text-center mb-4">
          <div class="avatar">👤</div>
          <strong id="adminName">Loading...</strong><br />
          <small>Admin</small>
        </div>

        <ul class="nav nav-pills flex-column mb-auto">
          <li><a href="index.html" class="nav-link">Dashboard</a></li>
          <li><a href="users.html" class="nav-link">Users</a></li>
          <li><a href="employees.html" class="nav-link">Employees</a></li>
          <li><a href="request.html" class="nav-link">Requests</a></li>
          <li><a href="reports.html" class="nav-link">Reports</a></li>
          <li><a href="news.html" class="nav-link">News</a></li>
          <li><a href="trucklogs.html" class="nav-link">Truck Logs</a></li>
          <li><a href="trucks.html" class="nav-link">Trucks</a></li>
          <li><a href="schedule.html" class="nav-link">Scheduling</a></li>
          <li><a href="dispatch.html" class="nav-link">Dispatch</a></li>
          <li><a href="generate-qr.html" class="nav-link">QR Code Generation</a></li>
        </ul>

        <button class="btn btn-light logout-btn">Log Out</button>
      </div>

      <!-- Main Content -->
      <div class="dashboard-wrapper container-fluid">
        <div class="form-container">
          <h3 class="text-center mb-4">🚛 Generate QR Code (Admin)</h3>

          <div class="mb-3">
            <label class="form-label">Truck Number</label>
            <select class="form-select" id="truckNumber">
              <option value="" disabled selected>Select a Truck</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" id="location" placeholder="Enter Location" />
          </div>

          <button class="btn btn-success w-100" onclick="generateQRCode()">Generate QR</button>

          <div id="qrPreview" style="display: none">
            <h5 class="mt-4">Generated QR Code (valid for 3 hours)</h5>
            <img id="qrImage" src="" alt="QR Code" />

            <a id="downloadLink" class="btn btn-outline-primary mt-3">⬇ Download as PDF</a>
          </div>

          <div class="history-controls mt-4">
            <h5 class="mb-0">QR Code History</h5>
            <button class="btn btn-danger btn-sm" onclick="clearHistory()">🗑 Clear History</button>
          </div>

          <table class="table table-bordered mt-3">
            <thead class="table-success">
              <tr>
                <th>Truck</th>
                <th>Location</th>
                <th>Generated At</th>
              </tr>
            </thead>
            <tbody id="qrHistory"></tbody>
          </table>

        </div>
      </div>
    </div>

    <script>
      const API_BASE = "https://ecobantay-backend.onrender.com";
      const token = localStorage.getItem("adminToken");

      if (!token) {
        alert("Unauthorized. Redirecting...");
        window.location.href = "login.html";
      }

      // Load Admin Name
      fetch(`${API_BASE}/api/admin/profile`, {
        headers: { Authorization: `Bearer ${token}` }
      })
        .then(res => res.json())
        .then(data => {
          document.getElementById("adminName").innerText =
            data.name || `${data.firstName} ${data.lastName}` || "Admin";
        });

      // Load Real Trucks
      const truckDropdown = document.getElementById("truckNumber");
      fetch(`${API_BASE}/api/fleet-trucks`, {
        headers: { Authorization: `Bearer ${token}` }
      })
        .then(res => res.json())
        .then(trucks => {
          trucks.forEach(t => {
            const op = document.createElement("option");
            op.value = t.plateNumber;
            op.textContent = t.plateNumber;
            truckDropdown.appendChild(op);
          });
        });

      // Load history (separate for admin)
      let historyLog = JSON.parse(localStorage.getItem("qrAdminHistoryLog")) || [];

      function generateQRCode() {
        const truckNumber = document.getElementById("truckNumber").value;
        const location = document.getElementById("location").value;

        if (!truckNumber || !location) {
          alert("Please fill all fields.");
          return;
        }

        const timestamp = new Date().toISOString();

        fetch(`${API_BASE}/api/qr/generate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ truckNumber, location, timestamp })
        })
          .then(res => res.json())
          .then(data => {
            if (!data.qrCodeUrl) {
              alert("QR generation failed.");
              return;
            }

            // Show QR Preview
            document.getElementById("qrImage").src = data.qrCodeUrl;
            document.getElementById("qrPreview").style.display = "block";

            // PDF Export
            document.getElementById("downloadLink").onclick = () => {
              const { jsPDF } = window.jspdf;
              const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

              doc.setDrawColor(100);
              doc.rect(10, 10, 190, 277);

              doc.setFont("helvetica", "bold");
              doc.setFontSize(24);
              doc.text("ECOBANTAY", 105, 25, null, null, "center");

              const qrImg = new Image();
              qrImg.src = data.qrCodeUrl;

              qrImg.onload = function () {
                doc.rect(30, 40, 150, 150);
                doc.addImage(qrImg, "PNG", 35, 45, 140, 140);

                doc.setFont("helvetica", "normal");
                doc.setFontSize(14);
                doc.text("Scan this using EcoBantay App Scanner", 105, 270, null, null, "center");

                doc.save(`EcoBantayQR_${truckNumber}.pdf`);
              };
            };

            // Save History
            historyLog.unshift({ truckNumber, location, timestamp });
            localStorage.setItem("qrAdminHistoryLog", JSON.stringify(historyLog));
            renderHistoryTable();
          })
          .catch(err => {
            console.error("QR Error:", err);
            alert("QR generation error.");
          });
      }

      function renderHistoryTable() {
        const tbody = document.getElementById("qrHistory");
        tbody.innerHTML = "";
        historyLog.forEach(entry => {
          tbody.innerHTML += `
            <tr>
              <td>${entry.truckNumber}</td>
              <td>${entry.location}</td>
              <td>${new Date(entry.timestamp).toLocaleString()}</td>
            </tr>
          `;
        });
      }

      function clearHistory() {
        if (!confirm("Clear QR code history?")) return;
        localStorage.removeItem("qrAdminHistoryLog");
        historyLog = [];
        renderHistoryTable();
      }

      renderHistoryTable();

      // Logout
      document.querySelector(".logout-btn").addEventListener("click", () => {
        localStorage.removeItem("adminToken");
        window.location.href = "login.html";
      });
    </script>
  </body>
</html>
