<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="assets/ecobantay-icon.png">

    <title>EcoBantay - Employees</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
      }
      #sidebar {
        min-height: 100vh;
        width: 240px;
        background-image: url("assets/background.png");
        background-size: cover;
        background-position: center;
        color: white;
        position: fixed;
      }
      #sidebar .nav-link {
        color: white;
        font-weight: 500;
        padding: 10px 20px;
      }
      #sidebar .nav-link:hover,
      #sidebar .nav-link.active {
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 5px;
      }
      .dashboard-wrapper {
        margin-left: 240px;
        padding: 2rem;
      }
      .avatar {
        width: 60px;
        height: 60px;
        background-color: white;
        color: #2e8b57;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin: 0 auto 10px;
      }
      .logout-btn {
        width: 100%;
        margin-top: auto;
      }

      .section-title {
        background: #c8f7c5;
        padding: 12px 18px;
        border-left: 6px solid #53b052;
        border-radius: 8px;
        font-size: 1.3rem;
        font-weight: bold;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="d-flex">
      <div id="sidebar" class="d-flex flex-column p-3">
        <div class="text-center mb-4">
          <div class="avatar">👤</div>
          <strong id="adminName">Loading...</strong><br />
          <small>Admin</small>
        </div>
        <ul class="nav nav-pills flex-column mb-auto">
          <li><a href="index.html" class="nav-link">Dashboard</a></li>
          <li><a href="users.html" class="nav-link">Users</a></li>
          <li>
            <a href="employees.html" class="nav-link active ">Employees</a>
          </li>
          <li><a href="request.html" class="nav-link">Requests</a></li>
          <li><a href="reports.html" class="nav-link">Reports</a></li>
          <li><a href="news.html" class="nav-link ">News</a></li>
          <li>
            <a href="trucklogs.html" class="nav-link ">Truck Logs</a>
          </li>
          <li><a href="trucks.html" class="nav-link ">Trucks</a></li>
          <li> <a href="schedule.html" class="nav-link">Scheduling</a></li>
          <li> <a href="dispatch.html" class="nav-link">Dispatch</a></li>
          <li><a href="generate-qr.html" class="nav-link">QR Code Generation</a></li>

        </ul>
        <button class="btn btn-light logout-btn">Log Out</button>
      </div>

      <div class="dashboard-wrapper container-fluid">
              <div class="section-title">All Employees (Staff and Driver)</div>

        <button
          class="btn btn-success mb-3"
          data-bs-toggle="modal"
          data-bs-target="#createEmployeeModal"
        >
          ➕ Create Employee
        </button>

        <input
          type="text"
          id="searchEmployee"
          class="form-control mb-3"
          placeholder="Search by name or email"
        />
        <!-- Table -->
        <table
          class="table table-bordered table-hover table-striped align-middle"
        >
          <thead class="table-success">
            <tr>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Email</th>
              <th>Contact</th>
              <th>Role</th>
              <th>Status</th>
              <!-- ✅ new column -->
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="employeeTable"></tbody>
        </table>
      </div>
    </div>

    <div class="modal fade" id="editEmployeeModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="editEmployeeForm">
            <div class="modal-header">
              <h5 class="modal-title">Edit Employee</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" name="_id" />
              <input
                type="text"
                name="firstName"
                class="form-control mb-2"
                placeholder="First Name"
                required
              />
              <input
                type="text"
                name="lastName"
                class="form-control mb-2"
                placeholder="Last Name"
                required
              />
              <input
                type="email"
                name="email"
                class="form-control mb-2"
                placeholder="Email"
                required
              />
              <input
                type="text"
                name="contactNumber"
                class="form-control mb-2"
                placeholder="Contact"
                required
                pattern="^09\d{9}$"
                maxlength="11"
                title="Contact number must start with 09 and be exactly 11 digits"
              />
              <input
                type="text"
                name="gender"
                class="form-control mb-2"
                placeholder="Gender"
                required
              />
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-primary">
                Save Changes
              </button>
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Create Employee Modal -->
    <div class="modal fade" id="createEmployeeModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="createEmployeeForm">
            <div class="modal-header">
              <h5 class="modal-title">Create Employee Account</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <input
                type="text"
                name="firstName"
                class="form-control mb-2"
                placeholder="First Name"
                required
              />
              <input
                type="text"
                name="lastName"
                class="form-control mb-2"
                placeholder="Last Name"
                required
              />
              <input
                type="email"
                name="email"
                class="form-control mb-2"
                placeholder="Email"
                required
              />
              <input
                type="text"
                name="contactNumber"
                class="form-control mb-2"
                placeholder="Contact (11 digits)"
                pattern="^09\d{9}$"
                maxlength="11"
                required
              />

              <select name="gender" class="form-control mb-2" required>
                <option value="" disabled selected>Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>

              <select
                name="role"
                class="form-control mb-2"
                id="roleSelect"
                required
              >
                <option value="" disabled selected>Select Role</option>
                <option value="staff">Staff</option>
                <option value="driver">Driver</option>
              </select>

              <div id="statusGroup" style="display: none">
                <select name="status" class="form-control mb-2">
                  <option value="" disabled selected>Select Status</option>
                  <option value="available">Available</option>
                  <option value="unavailable">Unavailable</option>
                </select>
              </div>

              <input
                type="password"
                name="password"
                class="form-control mb-2"
                placeholder="Password"
                required
              />
              <input
                type="password"
                id="confirmPassword"
                class="form-control mb-2"
                placeholder="Confirm Password"
                required
              />

              <input
                type="text"
                name="city"
                class="form-control mb-2"
                placeholder="City"
                required
              />
              <input
                type="text"
                name="barangay"
                class="form-control mb-2"
                placeholder="Barangay"
                required
              />
              <input
                type="text"
                name="address"
                class="form-control mb-2"
                placeholder="Full Address"
                required
              />
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-primary">Create</button>
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const token = localStorage.getItem("adminToken");
      if (!token) {
        alert("Unauthorized. Redirecting to login...");
        window.location.href = "login.html";
      }

      // Load admin name
      fetch("https://ecobantay-backend.onrender.com/api/admin/profile", {
        headers: { Authorization: `Bearer ${token}` },
      })
        .then((res) => res.json())
        .then((data) => {
          document.getElementById("adminName").innerText = data.name || "Admin";
        });

      // Load staff and drivers
      let employeesList = []; // ⬅️ store all employees for reuse

      fetch("https://ecobantay-backend.onrender.com/api/admin/employees", {
        headers: { Authorization: `Bearer ${token}` },
      })
        .then((res) => res.json())
        .then((data) => {
          employeesList = data.employees;
          renderEmployeeTable(employeesList);
        });

      function renderEmployeeTable(employees) {
        const table = document.getElementById("employeeTable");
        table.innerHTML = "";

        employees.forEach((emp) => {
          const statusDisplay =
            emp.role === "driver" ? emp.status || "N/A" : "-";
          const row = `
      <tr>
        <td>${emp.firstName}</td>
        <td>${emp.lastName}</td>
        <td>${emp.email}</td>
        <td>${emp.contactNumber || "-"}</td>
        <td>${emp.role}</td>
        <td>${statusDisplay}</td>
        <td>
          <button class="btn btn-warning btn-sm" onclick="openEditModal('${
            emp._id
          }')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteEmployee('${
            emp._id
          }')">Delete</button>
        </td>
      </tr>
    `;
          table.innerHTML += row;
        });
      }

      // Open edit modal for staff/driver
      function openEditModal(id) {
        fetch(`https://ecobantay-backend.onrender.com/api/admin/employee/${id}`, {
          headers: { Authorization: `Bearer ${token}` },
        })
          .then((res) => res.json())
          .then((emp) => {
            const form = document.getElementById("editEmployeeForm");
            form._id.value = emp._id;
            form.firstName.value = emp.firstName;
            form.lastName.value = emp.lastName;
            form.email.value = emp.email;
            form.contactNumber.value = emp.contactNumber;
            form.gender.value = emp.gender;
            new bootstrap.Modal(
              document.getElementById("editEmployeeModal")
            ).show();
          });
      }

      // Submit employee edit
      document
        .getElementById("editEmployeeForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const formData = new FormData(this);
          const payload = Object.fromEntries(formData.entries());

          fetch(
            `https://ecobantay-backend.onrender.com/api/admin/update-employee/${payload._id}`,
            {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify(payload),
            }
          )
            .then((res) => res.json())
            .then((data) => {
              alert(data.message || "Employee updated.");
              bootstrap.Modal.getInstance(
                document.getElementById("editEmployeeModal")
              ).hide();
              location.reload();
            });
        });

      // Delete employee
      function deleteEmployee(id) {
        if (!confirm("Are you sure you want to delete this employee?")) return;

        fetch(`https://ecobantay-backend.onrender.com/api/admin/delete-employee/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        })
          .then((res) => res.json())
          .then((data) => {
            alert(data.message || "Deleted successfully.");
            location.reload();
          });
      }

      // Show status dropdown only if role is driver
      document
        .getElementById("roleSelect")
        .addEventListener("change", function () {
          const statusGroup = document.getElementById("statusGroup");
          statusGroup.style.display =
            this.value === "driver" ? "block" : "none";
        });

      // Create Employee Submit
      document
        .getElementById("createEmployeeForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const formData = new FormData(this);
          const payload = Object.fromEntries(formData.entries());

          // Validate password confirmation
          const password = payload.password;
          const confirmPassword =
            document.getElementById("confirmPassword").value;
          if (password !== confirmPassword) {
            alert("Passwords do not match.");
            return;
          }

          fetch("https://ecobantay-backend.onrender.com/api/admin/create-employee", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify(payload),
          })
            .then((res) => res.json())
            .then((data) => {
              alert(data.message || "Employee created.");
              bootstrap.Modal.getInstance(
                document.getElementById("createEmployeeModal")
              ).hide();
              location.reload();
            })
            .catch((err) => {
              console.error("❌ Failed to create employee:", err);
              alert("Failed to create employee.");
            });
        });

      document
        .getElementById("searchEmployee")
        .addEventListener("input", function () {
          const query = this.value.toLowerCase();

          const filtered = employeesList.filter((emp) => {
            const fullName = `${emp.firstName} ${emp.lastName}`.toLowerCase();
            return (
              fullName.includes(query) ||
              emp.email.toLowerCase().includes(query) ||
              (emp.contactNumber || "").includes(query)
            );
          });

          renderEmployeeTable(filtered);
        });
    </script>
  </body>
</html>
