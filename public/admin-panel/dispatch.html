<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="assets/ecobantay-icon.png">
    <title>EcoBantay - Dispatching</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
      }
      #sidebar {
        min-height: 100vh;
        width: 240px;
        background-image: url("assets/background.png");
        background-size: cover;
        background-position: center;
        color: white;
        position: fixed;
      }
      #sidebar .nav-link {
        color: white;
        font-weight: 500;
        padding: 10px 20px;
      }
      #sidebar .nav-link:hover,
      #sidebar .nav-link.active {
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 5px;
      }
      .dashboard-wrapper {
        margin-left: 240px;
        padding: 2rem;
      }
      .avatar {
        width: 60px;
        height: 60px;
        background-color: white;
        color: #2e8b57;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin: 0 auto 10px;
      }
      .logout-btn {
        width: 100%;
        margin-top: auto;
      }

      .section-title {
        background: #c8f7c5;
        padding: 12px 18px;
        border-left: 6px solid #53b052;
        border-radius: 8px;
        font-size: 1.3rem;
        font-weight: bold;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="d-flex">
      <!-- Sidebar -->
      <div id="sidebar" class="d-flex flex-column p-3">
        <div class="text-center mb-4">
          <div class="avatar">👤</div>
          <strong id="adminName">Loading...</strong><br />
          <small>Admin</small>
        </div>
        <ul class="nav nav-pills flex-column mb-auto">
          <li><a href="index.html" class="nav-link">Dashboard</a></li>
          <li><a href="users.html" class="nav-link">Users</a></li>
          <li><a href="employees.html" class="nav-link">Employees</a></li>
          <li><a href="request.html" class="nav-link">Requests</a></li>
          <li><a href="reports.html" class="nav-link">Reports</a></li>
          <li><a href="news.html" class="nav-link">News</a></li>
          <li><a href="trucklogs.html" class="nav-link">Truck Logs</a></li>
          <li><a href="trucks.html" class="nav-link">Trucks</a></li>
          <li><a href="schedule.html" class="nav-link">Scheduling</a></li>
          <li><a href="dispatch.html" class="nav-link active">Dispatch</a></li>
          <li><a href="generate-qr.html" class="nav-link">QR Code Generation</a></li>

        </ul>
        <button class="btn btn-light logout-btn">Log Out</button>
      </div>

      <!-- Dashboard content -->
      <div class="dashboard-wrapper container-fluid">
      <div class="section-title">Truck Dispatching</div>
        <button
          class="btn btn-success mb-3"
          data-bs-toggle="modal"
          data-bs-target="#createDispatchModal"
        >
          ➕ Create Dispatch
        </button>

        <input
          type="text"
          id="searchDispatch"
          class="form-control mb-3"
          placeholder="Search by barangay, route, or target"
        />

        <!-- Table -->
        <table class="table table-bordered table-hover table-striped align-middle">
          <thead class="table-success">
            <tr>
              <th>Schedule</th>
              <th>Route</th>
              <th>Truck</th>
              <th>Driver</th>
              <th>Shift</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="dispatchTable"></tbody>
        </table>
      </div>
    </div>

    <!-- Create Modal -->
    <div class="modal fade" id="createDispatchModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="createDispatchForm">
            <div class="modal-header">
              <h5 class="modal-title">Create Dispatch</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <select name="scheduleId" class="form-control mb-2" required id="scheduleSelect">
                <option value="" disabled selected>Select Schedule</option>
              </select>
              <input type="text" name="shift" id="shiftDisplay" class="form-control mb-2" placeholder="Shift" readonly />
              <!-- Show selected route name for clarity -->
              <input type="text" id="routeDisplay" class="form-control mb-2" placeholder="Route" readonly />

              <select name="truckId" class="form-control mb-2" required id="truckSelect">
                <option value="" disabled selected>Select Truck</option>
              </select>
              <select name="driverId" class="form-control mb-2" id="driverSelect">
                <option value="">Select Driver (optional)</option>
              </select>
              <input type="date" name="date" class="form-control mb-2" required />
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-primary">Create</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editDispatchModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="editDispatchForm">
            <div class="modal-header">
              <h5 class="modal-title">Edit Dispatch</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" name="_id" />
              <select name="scheduleId" class="form-control mb-2" required id="editScheduleSelect"></select>
              <input type="text" name="shift" id="editShiftDisplay" class="form-control mb-2" placeholder="Shift" readonly />
              <!-- Show selected route name -->
              <input type="text" id="editRouteDisplay" class="form-control mb-2" placeholder="Route" readonly />

              <select name="truckId" class="form-control mb-2" required id="editTruckSelect"></select>
              <select name="driverId" class="form-control mb-2" id="editDriverSelect">
                <option value="">Select Driver (optional)</option>
              </select>
              <input type="date" name="date" class="form-control mb-2" required />
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-primary">Save</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const API_BASE = "https://ecobantay-backend.onrender.com";
      const token = localStorage.getItem("adminToken");
      if (!token) {
        alert("Unauthorized. Redirecting to login...");
        window.location.href = "login.html";
      }

      // Clear stored data on logout
      document.querySelector('.logout-btn').addEventListener('click', () => {
        localStorage.removeItem('dispatchList');
        localStorage.removeItem('schedulesList');
        localStorage.removeItem('trucksList');
        localStorage.removeItem('driversList');
        localStorage.removeItem('routesList');
        localStorage.removeItem('adminToken');
        window.location.href = 'login.html';
      });

      // Load admin name
      fetch(`${API_BASE}/api/admin/profile`, {
        headers: { Authorization: `Bearer ${token}` },
      })
        .then(res => res.json())
        .then(data => {
          document.getElementById("adminName").innerText = data.name || "Admin";
        });

      // Initialize lists from localStorage or empty arrays
      let dispatchList = JSON.parse(localStorage.getItem('dispatchList') || '[]');
      let schedulesList = JSON.parse(localStorage.getItem('schedulesList') || '[]');
      let trucksList = JSON.parse(localStorage.getItem('trucksList') || '[]');
      let driversList = JSON.parse(localStorage.getItem('driversList') || '[]');
      let routesList = JSON.parse(localStorage.getItem('routesList') || '[]');

      // Best-effort: assign route to a truck (sets in_use + currentRoute)
      async function assignRouteToTruck(truckId, routeId) {
        if (!truckId || !routeId) return;
        try {
          await fetch(`${API_BASE}/api/admin/trucks/${truckId}/assign-route`, {
            method: "PUT",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
            body: JSON.stringify({ routeId, status: "in_use" })
          });
        } catch (e) {
          // Silent: backend may not have this endpoint yet
          console.warn("assign-route endpoint not available or failed.");
        }
      }

      // Preload schedules, trucks, drivers, routes (with filtering)
      async function preloadOptions(selectedDate = null) {
        const [sRes, tRes, dRes, rRes] = await Promise.all([
          fetch(`${API_BASE}/api/admin/schedules`, { headers: { Authorization: `Bearer ${token}` } }),
          fetch(`${API_BASE}/api/fleet-trucks`, { headers: { Authorization: `Bearer ${token}` } }),
          fetch(`${API_BASE}/api/admin/employees`, { headers: { Authorization: `Bearer ${token}` } }),
          // Use same as scheduling (truck routes listing)
          fetch(`${API_BASE}/api/trucks/routes`, { headers: { Authorization: `Bearer ${token}` } }),
        ]);

        const sData = await sRes.json();
        const tData = await tRes.json();
        const dData = await dRes.json();
        const rData = await rRes.json();

        schedulesList = sData.schedules || [];
        trucksList = tData || [];
        driversList = dData.employees || [];
        routesList = rData.routes || rData || [];

        // Persist
        localStorage.setItem('schedulesList', JSON.stringify(schedulesList));
        localStorage.setItem('trucksList', JSON.stringify(trucksList));
        localStorage.setItem('driversList', JSON.stringify(driversList));
        localStorage.setItem('routesList', JSON.stringify(routesList));

        // 🗓 get date from form or default today
        const dateInput = document.querySelector("#createDispatchForm input[name='date']");
        const filterDate = selectedDate || (dateInput?.value || new Date().toISOString().split("T")[0]);

        const sameDayDispatches = dispatchList.filter(d => (d.date || "").split("T")[0] === filterDate);

        const usedTruckIds = sameDayDispatches.map(d => d.truckId);
        const usedDriverIds = sameDayDispatches.map(d => d.driverId).filter(Boolean);

        const availableTrucks = trucksList.filter(t => (t.status === "Available" || t.status === "available") && !usedTruckIds.includes(t._id));
        const availableDrivers = driversList.filter(d => (d.role === "driver" || (d.role||"").toLowerCase()==="driver") && (d.status === "available" || !d.status) && !usedDriverIds.includes(d._id));

        // ✅ Populate create modal
        const scheduleSelect = document.getElementById("scheduleSelect");
        const truckSelect = document.getElementById("truckSelect");
        const driverSelect = document.getElementById("driverSelect");

        scheduleSelect.innerHTML = '<option value="" disabled selected>Select Schedule</option>';
        truckSelect.innerHTML = '<option value="" disabled selected>Select Truck</option>';
        driverSelect.innerHTML = '<option value="">Select Driver (optional)</option>';

        schedulesList.forEach(s => {
          const routeNm = routeName(s.routeId);
          scheduleSelect.innerHTML += `<option value="${s._id}">${s.barangay} - ${s.shift}${routeNm ? ' • ' + routeNm : ''}</option>`;
        });

        availableTrucks.forEach(t => {
          truckSelect.innerHTML += `<option value="${t._id}">${t.plateNumber || t.code} (${t.type || 'truck'})</option>`;
        });

        availableDrivers.forEach(d => {
          const fullName = `${d.firstName || ''} ${d.lastName || ''}`.trim() || d.name || d.email;
          driverSelect.innerHTML += `<option value="${d._id}">${fullName}</option>`;
        });

        // ✅ Populate edit modal (full lists for editing)
        const editScheduleSelect = document.getElementById("editScheduleSelect");
        const editTruckSelect = document.getElementById("editTruckSelect");
        const editDriverSelect = document.getElementById("editDriverSelect");

        editScheduleSelect.innerHTML = "";
        editTruckSelect.innerHTML = "";
        editDriverSelect.innerHTML = "";

        schedulesList.forEach(s => {
          const routeNm = routeName(s.routeId);
          editScheduleSelect.innerHTML += `<option value="${s._id}">${s.barangay} - ${s.shift}${routeNm ? ' • ' + routeNm : ''}</option>`;
        });
        trucksList.forEach(t => {
          editTruckSelect.innerHTML += `<option value="${t._id}">${t.plateNumber || t.code} (${t.type || 'truck'})</option>`;
        });
        driversList.forEach(d => {
          const fullName = `${d.firstName || ''} ${d.lastName || ''}`.trim() || d.name || d.email;
          editDriverSelect.innerHTML += `<option value="${d._id}">${fullName}</option>`;
        });
      }

      // Helper: route name by id
      function routeName(id) {
        if (!id) return "";
        const r = routesList.find(rt => rt._id === id);
        return r ? r.name : "";
      }

      // Auto-fill shift + route name on CREATE
      document.getElementById("scheduleSelect").addEventListener("change", e => {
        const selected = schedulesList.find(s => s._id === e.target.value);
        document.getElementById("shiftDisplay").value = selected ? selected.shift : "";
        document.getElementById("routeDisplay").value = selected ? (routeName(selected.routeId) || "") : "";
      });

      // Auto-fill shift + route name on EDIT
      document.getElementById("editScheduleSelect").addEventListener("change", e => {
        const selected = schedulesList.find(s => s._id === e.target.value);
        document.getElementById("editShiftDisplay").value = selected ? selected.shift : "";
        document.getElementById("editRouteDisplay").value = selected ? (routeName(selected.routeId) || "") : "";
      });

      // Update trucks/drivers when date changes
      document.querySelector("#createDispatchForm input[name='date']").addEventListener("change", e => {
        preloadOptions(e.target.value);
      });

      async function loadDispatches() {
        const res = await fetch(`${API_BASE}/api/admin/dispatches`, { headers: { Authorization: `Bearer ${token}` } });
        const data = await res.json();
        dispatchList = data.dispatches || [];
        localStorage.setItem('dispatchList', JSON.stringify(dispatchList));
        renderDispatchTable(dispatchList);
      }

      function renderDispatchTable(list) {
        const table = document.getElementById("dispatchTable");
        table.innerHTML = "";
        list.forEach(d => {
          const schedule = schedulesList.find(s => s._id === d.scheduleId);
          const truck = trucksList.find(t => t._id === d.truckId);
          const driver = driversList.find(dr => dr._id === d.driverId);

          const scheduleText = schedule ? `${schedule.barangay} - ${schedule.shift}` : "-";
          const routeText = schedule ? (routeName(schedule.routeId) || "-") : "-";
          const truckText = truck ? `${truck.plateNumber || truck.code} (${truck.type || 'truck'})` : "N/A";
          const driverText = driver ? `${(driver.firstName||'') + ' ' + (driver.lastName||'')}`.trim() : "-";

          const row = `
            <tr>
              <td>${scheduleText}</td>
              <td>${routeText}</td>
              <td>${truckText}</td>
              <td>${driverText}</td>
              <td>${schedule ? schedule.shift : "-"}</td>
              <td>${d.date ? new Date(d.date).toLocaleDateString() : "-"}</td>
              <td>
                <button class="btn btn-warning btn-sm" onclick="openEditModal('${d._id}')">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteDispatch('${d._id}')">Delete</button>
              </td>
            </tr>
          `;
          table.innerHTML += row;
        });
      }

      // Search (barangay/route)
      document.getElementById("searchDispatch").addEventListener("input", e => {
        const term = e.target.value.toLowerCase();
        renderDispatchTable(dispatchList.filter(d => {
          const schedule = schedulesList.find(s => s._id === d.scheduleId);
          const barangayHit = (schedule?.barangay || "").toLowerCase().includes(term);
          const routeHit = (routeName(schedule?.routeId) || "").toLowerCase().includes(term);
          return barangayHit || routeHit;
        }));
      });

      // Create dispatch
      document.getElementById("createDispatchForm").addEventListener("submit", async e => {
        e.preventDefault();
        const form = Object.fromEntries(new FormData(e.target));

        // Attach routeId based on selected schedule
        const selectedSched = schedulesList.find(s => s._id === form.scheduleId);
        if (selectedSched?.routeId) form.routeId = selectedSched.routeId;

        const res = await fetch(`${API_BASE}/api/admin/create-dispatch`, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
          body: JSON.stringify(form)
        });
        const data = await res.json();
        if (data.success) {
          // Best-effort: immediately assign route to truck so driver app can fetch it
          if (form.truckId && form.routeId) {
            await assignRouteToTruck(form.truckId, form.routeId);
          }
          await loadDispatches();
          await preloadOptions(); // refresh options after dispatch creation
          bootstrap.Modal.getInstance(document.getElementById("createDispatchModal")).hide();
        } else alert(data.message || "Failed to create dispatch");
      });

      // Edit dispatch
      function openEditModal(id) {
        const dispatch = dispatchList.find(d => d._id === id);
        const form = document.getElementById("editDispatchForm");
        form._id.value = dispatch._id;
        form.scheduleId.value = dispatch.scheduleId;
        form.truckId.value = dispatch.truckId;
        form.driverId.value = dispatch.driverId || "";
        form.date.value = (dispatch.date || "").split("T")[0];

        const selected = schedulesList.find(s => s._id === dispatch.scheduleId);
        document.getElementById("editShiftDisplay").value = selected ? selected.shift : "";
        document.getElementById("editRouteDisplay").value = selected ? (routeName(selected.routeId) || "") : "";

        new bootstrap.Modal(document.getElementById("editDispatchModal")).show();
      }

      document.getElementById("editDispatchForm").addEventListener("submit", async e => {
        e.preventDefault();
        const form = Object.fromEntries(new FormData(e.target));

        // Attach routeId from chosen schedule
        const selectedSched = schedulesList.find(s => s._id === form.scheduleId);
        if (selectedSched?.routeId) form.routeId = selectedSched.routeId;

        const res = await fetch(`${API_BASE}/api/admin/edit-dispatch/${form._id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
          body: JSON.stringify(form)
        });
        const data = await res.json();
        if (data.success) {
          // Update truck route if changed
          if (form.truckId && form.routeId) {
            await assignRouteToTruck(form.truckId, form.routeId);
          }
          await loadDispatches();
          await preloadOptions(); // refresh options
          bootstrap.Modal.getInstance(document.getElementById("editDispatchModal")).hide();
        } else alert(data.message || "Failed to edit dispatch");
      });

      async function deleteDispatch(id) {
        if (!confirm("Are you sure you want to delete this dispatch?")) return;
        const res = await fetch(`${API_BASE}/api/admin/delete-dispatch/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
          await loadDispatches();
          await preloadOptions(); // refresh after delete
        }
        else alert(data.message || "Failed to delete dispatch");
      }

      // Initial load
      (async () => {
        await loadDispatches();
        await preloadOptions();
      })();
    </script>
  </body>
</html>
