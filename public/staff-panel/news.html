<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="assets/ecobantay-icon.png">
    <title>EcoBantay Staff - News</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
      }
      #sidebar {
        min-height: 100vh;
        width: 240px;
        background-image: url("assets/background.png");
        background-size: cover;
        background-position: center;
        color: white;
        position: fixed;
      }
      #sidebar .nav-link {
        color: white;
        font-weight: 500;
        padding: 10px 20px;
      }
      #sidebar .nav-link:hover,
      #sidebar .nav-link.active {
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 5px;
      }
      .dashboard-wrapper {
        margin-left: 240px;
        padding: 2rem;
        min-height: 100vh;
      }
      .logout-btn {
        width: 100%;
        margin-top: auto;
      }
      .avatar {
        width: 60px;
        height: 60px;
        background-color: white;
        color: #2e8b57;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin: 0 auto 10px;
      }
      .img-preview {
        max-width: 100%;
        height: auto;
        border-radius: 6px;
        margin-top: 10px;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
      }
      .card-title {
        font-size: 1.25rem;
        font-weight: 600;
      }
      .card-text {
        font-size: 0.95rem;
      }
      .btn-success {
        background-color: #2e8b57;
        border: none;
      }
      .btn-success:hover {
        background-color: #276b47;
      }
    </style>
  </head>
  <body>
    <div class="d-flex">
      <!-- Sidebar -->
      <div id="sidebar" class="d-flex flex-column p-3">
        <div class="text-center mb-4">
          <div class="avatar">🧑‍🔧</div>
          <strong id="staffName">Loading...</strong><br />
          <small>Staff</small>
        </div>
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
          </li>
          <li><a href="generate-qr.html" class="nav-link">QR Code Generation</a> </li>
          <li><a href="staff-reports.html" class="nav-link">Request</a></li>
          <li><a href="staff-reports.html" class="nav-link">Report</a></li>
          <li><a href="news.html" class="nav-link active">News</a></li>
          <li><a href="trucklogs.html" class="nav-link ">Truck Logs</a></li>
          <li><a href="trucks.html" class="nav-link">Trucks</a></li>
          <li><a href="schedule.html" class="nav-link">Scheduling</a></li>
          <li><a href="dispatch.html" class="nav-link">Dispatching</a></li>
        </ul>
        <button class="btn btn-light logout-btn">Log Out</button>
      </div>

      <!-- Main Dashboard -->
      <div class="dashboard-wrapper container-fluid">
        <div class="card border-0 shadow-sm p-4 rounded-4 mb-5">
          <h4 class="mb-4">📝 Create New News</h4>
          <form id="newsForm" enctype="multipart/form-data">
            <div class="mb-3">
              <label class="form-label">Title</label>
              <input type="text" class="form-control" id="newsTitle" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Content</label>
              <textarea
                class="form-control"
                id="newsContent"
                rows="5"
                required
              ></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Upload Image</label>
              <input
                type="file"
                class="form-control"
                id="newsImage"
                accept="image/*"
              />
              <img id="previewImage" class="img-preview d-none" />
            </div>
            <button type="submit" class="btn btn-success">Post News</button>
          </form>
        </div>

        <h4 class="mb-3">📌 Recent News</h4>
        <div id="newsList" class="row row-cols-1 row-cols-md-2 g-4"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const token = localStorage.getItem("staffToken");
      const apiBase = "https://ecobantay-backend.onrender.com/api/news";

      if (!token) {
        alert("Unauthorized. Redirecting to login...");
        window.location.href = "login.html";
      }

      // Fetch Staff Name
      fetch("https://ecobantay-backend.onrender.com/api/staff/profile", {
        headers: { Authorization: `Bearer ${token}` },
      })
        .then((res) => res.json())
        .then((data) => {
          const fullName =
            data.firstName && data.lastName
              ? `${data.firstName} ${data.lastName}`
              : data.name || "Staff";
          document.getElementById("staffName").innerText = fullName;
        })
        .catch((err) => {
          console.error("❌ Failed to load staff name:", err);
          document.getElementById("staffName").innerText = "Staff";
        });

      // Image Preview
      document.getElementById("newsImage").addEventListener("change", (e) => {
        const preview = document.getElementById("previewImage");
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = () => {
            preview.src = reader.result;
            preview.classList.remove("d-none");
          };
          reader.readAsDataURL(file);
        }
      });

      // Submit News Form
      document
        .getElementById("newsForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const formData = new FormData();
          formData.append(
            "title",
            document.getElementById("newsTitle").value.trim()
          );
          formData.append(
            "content",
            document.getElementById("newsContent").value.trim()
          );
          const imageFile = document.getElementById("newsImage").files[0];
          if (imageFile) formData.append("image", imageFile);

          const res = await fetch(apiBase + "/create", {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
            body: formData,
          });

          if (res.ok) {
            alert("✅ News posted!");
            document.getElementById("newsForm").reset();
            document.getElementById("previewImage").classList.add("d-none");
            loadNews();
          } else {
            alert("❌ Failed to post news.");
          }
        });

      async function loadNews() {
        const res = await fetch(apiBase);
        const data = await res.json();
        const container = document.getElementById("newsList");
        container.innerHTML = "";
        data.forEach((item) => {
          container.innerHTML += `
          <div class="col">
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden h-100">
              ${
                item.imageUrl
                  ? `<img src="https://ecobantay-backend.onrender.com${item.imageUrl}" class="card-img-top">`
                  : ""
              }
              <div class="card-body">
                <h5 class="card-title">${item.title}</h5>
                <p class="card-text">${item.content}</p>
                <small class="text-muted">Posted on ${new Date(
                  item.createdAt
                ).toLocaleString()}</small>
                <div class="mt-3 d-flex justify-content-end gap-2">
                  <button class="btn btn-sm btn-outline-primary" onclick="editNews('${
                    item._id
                  }')">
                    <i class="bi bi-pencil-square"></i> Edit
                  </button>
                  <button class="btn btn-sm btn-outline-danger" onclick="deleteNews('${
                    item._id
                  }')">
                    <i class="bi bi-trash"></i> Delete
                  </button>
                </div>
              </div>
            </div>
          </div>`;
        });
      }

      async function deleteNews(id) {
        if (!confirm("Are you sure you want to delete this news?")) return;
        const res = await fetch(`${apiBase}/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });
        if (res.ok) {
          alert("🗑️ News deleted!");
          loadNews();
        } else {
          alert("❌ Failed to delete news.");
        }
      }

      async function editNews(id) {
        const item = await fetch(`${apiBase}/${id}`).then((res) => res.json());
        document.getElementById("newsTitle").value = item.title;
        document.getElementById("newsContent").value = item.content;
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      loadNews();

      document.querySelector(".logout-btn").addEventListener("click", () => {
        localStorage.removeItem("staffToken");
        window.location.href = "login.html";
      });
    </script>
  </body>
</html>
