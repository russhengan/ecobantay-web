<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="assets/ecobantay-icon.png">
    <title>Generate QR Code - EcoBantay Staff</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
      }
      #sidebar {
        min-height: 100vh;
        width: 240px;
        background-image: url("assets/background.png");
        background-size: cover;
        background-position: center;
        color: white;
        position: fixed;
      }
      #sidebar .nav-link {
        color: white;
        font-weight: 500;
        padding: 10px 20px;
      }
      #sidebar .nav-link:hover,
      #sidebar .nav-link.active {
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 5px;
      }
      .dashboard-wrapper {
        margin-left: 240px;
        padding: 2rem;
      }
      .avatar {
        width: 60px;
        height: 60px;
        background-color: white;
        color: #2e8b57;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin: 0 auto 10px;
      }
      .logout-btn {
        width: 100%;
        margin-top: auto;
      }
      .form-container {
        max-width: 600px;
        background-color: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        margin: auto;
      }
      #qrPreview {
        margin-top: 30px;
        text-align: center;
      }
      #qrImage {
        max-width: 300px;
        margin-top: 10px;
      }
      .history-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      table {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="d-flex">
      <!-- Sidebar -->
      <div id="sidebar" class="d-flex flex-column p-3">
        <div class="text-center mb-4">
          <div class="avatar">🧑‍🔧</div>
          <strong id="staffName">Loading...</strong><br />
          <small>Staff</small>
        </div>
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
          </li>
          <li>
            <a href="generate-qr.html" class="nav-link">QR Code Generation</a>
          </li>
          <li><a href="staff-request.html" class="nav-link">Request</a></li>
          <li><a href="staff-reports.html" class="nav-link">Report</a></li>
          <li><a href="news.html" class="nav-link">News</a></li>
          <li><a href="trucklogs.html" class="nav-link ">Truck Logs</a></li>
          <li><a href="trucks.html" class="nav-link">Trucks</a></li>
          <li><a href="schedule.html" class="nav-link">Scheduling</a></li>
          <li><a href="dispatch.html" class="nav-link">Dispatching</a></li>
        </ul>
        <button class="btn btn-light logout-btn">Log Out</button>
      </div>

      <!-- Main Content -->
      <div class="dashboard-wrapper container-fluid">
        <div class="form-container">
          <h3 class="text-center mb-4">🚛 Generate QR Code</h3>
          <div class="mb-3">
            <label for="truckNumber" class="form-label">Truck Number</label>
            <select class="form-select" id="truckNumber">
              <option value="" disabled selected>Select a Truck</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input
              type="text"
              class="form-control"
              id="location"
              placeholder="Enter Location"
            />
          </div>
          <button class="btn btn-success w-100" onclick="generateQRCode()">
            Generate QR
          </button>

          <div id="qrPreview" style="display: none">
            <h5 class="mt-4">Generated QR Code (valid for 3 hours)</h5>
            <img id="qrImage" src="" alt="QR Code" />
            <br />
            <a id="downloadLink" class="btn btn-outline-primary mt-2"
              >⬇ Download as PDF</a
            >
          </div>

          <div class="history-controls mt-4">
            <h5 class="mb-0">QR Code History</h5>
            <button class="btn btn-danger btn-sm" onclick="clearHistory()">
              🗑 Clear History
            </button>
          </div>
          <table class="table table-bordered">
            <thead class="table-success">
              <tr>
                <th>Truck Number</th>
                <th>Location</th>
                <th>Generated At</th>
              </tr>
            </thead>
            <tbody id="qrHistory"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      let historyLog = JSON.parse(localStorage.getItem("qrHistoryLog")) || [];

      function generateQRCode() {
        const truckNumber = document.getElementById("truckNumber").value;
        const location = document.getElementById("location").value;

        if (!truckNumber || !location) {
          alert("Please fill out both Truck Number and Location.");
          return;
        }

        const timestamp = new Date().toISOString();

        fetch("https://ecobantay-backend.onrender.com/api/qr/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ truckNumber, location, timestamp }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (!data.qrCodeUrl) {
              alert("QR generation failed.");
              return;
            }

            const img = document.getElementById("qrImage");
            img.src = data.qrCodeUrl;
            document.getElementById("qrPreview").style.display = "block";

            document.getElementById("downloadLink").onclick = () => {
              const { jsPDF } = window.jspdf;
              const doc = new jsPDF({
                orientation: "portrait",
                unit: "mm",
                format: "a4",
              });

              doc.setDrawColor(100);
              doc.setLineWidth(0.5);
              doc.rect(10, 10, 190, 277);

              doc.setFont("helvetica", "bold");
              doc.setFontSize(24);
              doc.text("ECOBANTAY", 105, 25, null, null, "center");

              const qrImg = new Image();
              qrImg.src = data.qrCodeUrl;

              qrImg.onload = function () {
                doc.setDrawColor(180);
                doc.rect(30, 40, 150, 150);
                doc.addImage(qrImg, "PNG", 35, 45, 140, 140);
                doc.setFont("helvetica", "normal");
                doc.setFontSize(14);
                doc.text(
                  "Scan this using EcoBantay App Scanner",
                  105,
                  270,
                  null,
                  null,
                  "center"
                );
                doc.save(`EcoBantayQR_${truckNumber}.pdf`);
              };
            };

            historyLog.unshift({ truckNumber, location, timestamp });
            localStorage.setItem("qrHistoryLog", JSON.stringify(historyLog));
            renderHistoryTable();
          })
          .catch((err) => {
            console.error("❌ QR Generation Error:", err);
            alert("Something went wrong while generating the QR code.");
          });
      }

      function renderHistoryTable() {
        const tbody = document.getElementById("qrHistory");
        tbody.innerHTML = "";
        historyLog.forEach((entry) => {
          const row = `<tr>
        <td>${entry.truckNumber}</td>
        <td>${entry.location}</td>
        <td>${new Date(entry.timestamp).toLocaleString()}</td>
      </tr>`;
          tbody.innerHTML += row;
        });
      }

      function clearHistory() {
        const confirmed = confirm("Are you sure you want to clear history?");
        if (!confirmed) return;

        localStorage.removeItem("qrHistoryLog");
        historyLog = [];
        renderHistoryTable();
      }

      const token = localStorage.getItem("staffToken");
      if (!token) {
        alert("Unauthorized. Redirecting to login...");
        window.location.href = "login.html";
      }

      fetch("https://ecobantay-backend.onrender.com/api/staff/profile", {
        headers: { Authorization: `Bearer ${token}` },
      })
        .then((res) => {
          if (!res.ok) throw new Error("Unauthorized");
          return res.json();
        })
        .then((data) => {
          document.getElementById("staffName").innerText =
            data.name || `${data.firstName} ${data.lastName}` || "Staff";
        })
        .catch((err) => {
          console.error("❌ Failed to load staff name:", err);
          document.getElementById("staffName").innerText = "Staff";
        });

      document.querySelector(".logout-btn").addEventListener("click", () => {
        localStorage.removeItem("staffToken");
        window.location.href = "index.html";
      });
      renderHistoryTable();

      // Dynamically populate Truck Number dropdown
      // Load real trucks with plate numbers
async function loadTrucks() {
  const res = await fetch("https://ecobantay-backend.onrender.com/api/fleet-trucks", {
    headers: { Authorization: `Bearer ${token}` }
  });

  const trucks = await res.json();
  const dropdown = document.getElementById("truckNumber");

  dropdown.innerHTML = `<option value="" disabled selected>Select a Truck</option>`;

  trucks.forEach(truck => {
    dropdown.innerHTML += `
      <option value="${truck.plateNumber}">
        ${truck.plateNumber} (${truck.type || "Truck"})
      </option>
    `;
  });
}

// Call this on page load
loadTrucks();
    </script>
  </body>
</html>
