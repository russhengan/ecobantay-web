<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="assets/ecobantay-icon.png">
    <title>Staff Truck Logs - EcoBantay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
      }
      #sidebar {
        min-height: 100vh;
        width: 240px;
        background-image: url("assets/background.png");
        background-size: cover;
        background-position: center;
        color: white;
        position: fixed;
      }
      #sidebar .nav-link {
        color: white;
        font-weight: 500;
        padding: 10px 20px;
      }
      #sidebar .nav-link:hover,
      #sidebar .nav-link.active {
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 5px;
      }
      .dashboard-wrapper {
        margin-left: 240px;
        padding: 2rem;
        background-color: #f1f3f5;
        min-height: 100vh;
      }
      .logout-btn {
        width: 100%;
        margin-top: auto;
      }
      .avatar {
        width: 60px;
        height: 60px;
        background-color: white;
        color: #2e8b57;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin: 0 auto 10px;
      }
    </style>
  </head>
  <body>
    <div class="d-flex">
      <!-- Sidebar -->
      <div id="sidebar" class="d-flex flex-column p-3">
        <div class="text-center mb-4">
          <div class="avatar">🧑‍🔧</div>
          <strong id="staffName">Loading...</strong><br />
          <small>Staff</small>
        </div>
        <ul class="nav nav-pills flex-column mb-auto">
          <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
          <li><a href="generate-qr.html" class="nav-link">QR Code Generation</a></li>
          <li><a href="staff-request.html" class="nav-link">Request</a></li>
          <li><a href="staff-reports.html" class="nav-link">Report</a></li>
          <li><a href="news.html" class="nav-link">News</a></li>
          <li><a href="trucklogs.html" class="nav-link ">Truck Logs</a></li>
          <li><a href="trucks.html" class="nav-link">Trucks</a></li>
          <li><a href="schedule.html" class="nav-link">Scheduling</a></li>
          <li><a href="dispatch.html" class="nav-link">Dispatching</a></li>
        </ul>
        <button class="btn btn-light logout-btn">Log Out</button>
      </div>

      <!-- Main Content -->
      <div class="dashboard-wrapper container-fluid">
        <h2 class="mb-4">Truck Attendance Logs (Read-Only)</h2>

        <!-- 📋 Log Table -->
        <div class="table-responsive">
          <table class="table table-bordered table-striped">
            <thead class="table-success">
              <tr>
                <th>Date</th>
                <th>Truck</th>
                <th>Driver</th>
                <th>Route</th>
                <th>Status</th>
                <th>Remarks</th>
              </tr>
            </thead>
            <tbody id="logTableBody"></tbody>
          </table>
        </div>

        <div class="text-muted text-center mt-5 small">
          EcoBantay Staff Panel © 2025 | Internal Use Only
        </div>
      </div>
    </div>

    <script>
      const token = localStorage.getItem("staffToken");
      if (!token) {
        alert("Unauthorized. Redirecting to login...");
        window.location.href = "login.html";
      }

      fetch("https://ecobantay-backend.onrender.com/api/staff/profile", {
        headers: { Authorization: `Bearer ${token}` },
      })
        .then((res) => res.json())
        .then((data) => {
          const fullName = data.firstName && data.lastName
            ? `${data.firstName} ${data.lastName}`
            : data.name || "Staff";
          document.getElementById("staffName").innerText = fullName;
        });

      fetch("https://ecobantay-backend.onrender.com/api/truck-logs", {
        headers: { Authorization: `Bearer ${token}` },
      })
        .then((res) => res.json())
        .then((logs) => {
          const tbody = document.getElementById("logTableBody");
          logs.forEach((log) => {
            const truckName = log.truckId?.name || "Unknown Truck";
            const driverName = log.driverId
              ? `${log.driverId.firstName} ${log.driverId.lastName}`
              : "Unknown";
            const row = `
              <tr>
                <td>${new Date(log.date).toLocaleDateString()}</td>
                <td>${truckName}</td>
                <td>${driverName}</td>
                <td>${log.routeName}</td>
                <td>${log.status}</td>
                <td>${log.remarks || "-"}</td>
              </tr>`;
            tbody.insertAdjacentHTML("beforeend", row);
          });
        });

      document.querySelector(".logout-btn").addEventListener("click", () => {
        localStorage.removeItem("staffToken");
        window.location.href = "login.html";
      });
    </script>
  </body>
</html>
