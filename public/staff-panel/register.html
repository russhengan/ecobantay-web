<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Staff - EcoBantay</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/ecobantay-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
  <h2>Create Staff Account</h2>
  <form id="registerForm">
    <div class="row">
      <div class="mb-3 col-md-6">
        <label class="form-label">First Name</label>
        <input type="text" class="form-control" id="firstName" required>
      </div>
      <div class="mb-3 col-md-6">
        <label class="form-label">Last Name</label>
        <input type="text" class="form-control" id="lastName" required>
      </div>
    </div>

    <div class="row">
      <div class="mb-3 col-md-6">
        <label class="form-label">Gender</label>
        <select class="form-select" id="gender" required>
          <option value="">-- Select Gender --</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>
      <div class="mb-3 col-md-6">
        <label class="form-label">Contact Number</label>
        <input type="text" class="form-control" id="contactNumber" required>
      </div>
    </div>

    <div class="row">
      <div class="mb-3 col-md-4">
        <label class="form-label">City</label>
        <input type="text" class="form-control" id="city" value="Valenzuela" required>
      </div>
      <div class="mb-3 col-md-4">
        <label class="form-label">Barangay</label>
        <input type="text" class="form-control" id="barangay" value="Marulas" required>
      </div>
      <div class="mb-3 col-md-4">
        <label class="form-label">Address</label>
        <input type="text" class="form-control" id="address" required>
      </div>
    </div>

    <div class="row">
      <div class="mb-3 col-md-6">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3 col-md-6">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Register Staff</button>
  </form>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const staffData = {
        firstName: document.getElementById("firstName").value,
        lastName: document.getElementById("lastName").value,
        gender: document.getElementById("gender").value,
        contactNumber: document.getElementById("contactNumber").value,
        city: document.getElementById("city").value,
        barangay: document.getElementById("barangay").value,
        address: document.getElementById("address").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      };

      try {
        const res = await fetch("https://ecobantay-backend.onrender.com/api/staff/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(staffData)
        });

        const data = await res.json();
        if (res.ok) {
          alert("Staff registered successfully! You can now login.");
          window.location.href = "login.html";
        } else {
          alert(data.message || "Registration failed.");
        }
      } catch (error) {
        console.error("Registration error:", error);
        alert("Server error occurred.");
      }
    });
  </script>
</body>
</html>
