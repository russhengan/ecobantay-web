<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="assets/ecobantay-icon.png">
    <title>EcoBantay - Staff Dispatching</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
      }
      #sidebar {
        min-height: 100vh;
        width: 240px;
        background-image: url("assets/background.png");
        background-size: cover;
        background-position: center;
        color: white;
        position: fixed;
      }
      #sidebar .nav-link {
        color: white;
        font-weight: 500;
        padding: 10px 20px;
      }
      #sidebar .nav-link:hover,
      #sidebar .nav-link.active {
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 5px;
      }
      .dashboard-wrapper {
        margin-left: 240px;
        padding: 2rem;
        min-height: 100vh;
      }
      .avatar {
        width: 60px;
        height: 60px;
        background-color: white;
        color: #2e8b57;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin: 0 auto 10px;
      }
      .logout-btn {
        width: 100%;
        margin-top: auto;
      }
      .section-title {
        background: #c8f7c5;
        padding: 12px 18px;
        border-left: 6px solid #53b052;
        border-radius: 8px;
        font-size: 1.3rem;
        font-weight: bold;
        margin-bottom: 20px;
      }
    </style>
  </head>

  <body>
    <div class="d-flex">
      <!-- Sidebar -->
      <div id="sidebar" class="d-flex flex-column p-3">
        <div class="text-center mb-4">
          <div class="avatar">🧑‍🔧</div>
          <strong id="staffName">Loading...</strong><br />
          <small>Staff</small>
        </div>

        <ul class="nav nav-pills flex-column mb-auto">
          <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
          <li>
            <a href="generate-qr.html" class="nav-link">QR Code Generation</a>
          </li>
          <li><a href="staff-request.html" class="nav-link">Request</a></li>
          <li><a href="staff-reports.html" class="nav-link">Report</a></li>
          <li><a href="news.html" class="nav-link">News</a></li>
          <li><a href="trucklogs.html" class="nav-link">Truck Logs</a></li>
          <li><a href="trucks.html" class="nav-link">Trucks</a></li>
          <li><a href="schedule.html" class="nav-link">Scheduling</a></li>
          <li><a href="dispatch.html" class="nav-link active">Dispatch</a></li>
        </ul>

        <button class="btn btn-light logout-btn">Log Out</button>
      </div>

      <!-- MAIN CONTENT -->
      <div class="dashboard-wrapper container-fluid">
        <div class="section-title">Truck Dispatching</div>

        <button
          class="btn btn-success mb-3"
          data-bs-toggle="modal"
          data-bs-target="#createDispatchModal"
        >
          ➕ Create Dispatch
        </button>

        <input
          type="text"
          id="searchDispatch"
          class="form-control mb-3"
          placeholder="Search by barangay, route, or target"
        />

        <table
          class="table table-bordered table-hover table-striped align-middle"
        >
          <thead class="table-success">
            <tr>
              <th>Schedule</th>
              <th>Route</th>
              <th>Truck</th>
              <th>Driver</th>
              <th>Shift</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="dispatchTable"></tbody>
        </table>
      </div>
    </div>

    <!-- CREATE DISPATCH MODAL -->
    <div class="modal fade" id="createDispatchModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="createDispatchForm">
            <div class="modal-header">
              <h5 class="modal-title">Create Dispatch</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <select
                name="scheduleId"
                id="scheduleSelect"
                class="form-control mb-2"
                required
              ></select>

              <input
                type="text"
                id="shiftDisplay"
                class="form-control mb-2"
                placeholder="Shift"
                readonly
              />
              <input
                type="text"
                id="routeDisplay"
                class="form-control mb-2"
                placeholder="Route"
                readonly
              />

              <select
                name="truckId"
                id="truckSelect"
                class="form-control mb-2"
                required
              ></select>
              <select
                name="driverId"
                id="driverSelect"
                class="form-control mb-2"
              >
                <option value="">Select Driver (optional)</option>
              </select>

              <input
                type="date"
                name="date"
                class="form-control mb-2"
                required
              />
            </div>

            <div class="modal-footer">
              <button class="btn btn-primary" type="submit">Create</button>
              <button class="btn btn-secondary" data-bs-dismiss="modal">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- EDIT DISPATCH MODAL -->
    <div class="modal fade" id="editDispatchModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="editDispatchForm">
            <div class="modal-header">
              <h5 class="modal-title">Edit Dispatch</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" name="_id" />

              <select
                name="scheduleId"
                id="editScheduleSelect"
                class="form-control mb-2"
                required
              ></select>

              <input
                type="text"
                id="editShiftDisplay"
                class="form-control mb-2"
                placeholder="Shift"
                readonly
              />
              <input
                type="text"
                id="editRouteDisplay"
                class="form-control mb-2"
                placeholder="Route"
                readonly
              />

              <select
                name="truckId"
                id="editTruckSelect"
                class="form-control mb-2"
                required
              ></select>
              <select
                name="driverId"
                id="editDriverSelect"
                class="form-control mb-2"
              ></select>

              <input
                type="date"
                name="date"
                class="form-control mb-2"
                required
              />
            </div>

            <div class="modal-footer">
              <button class="btn btn-primary" type="submit">Save</button>
              <button class="btn btn-secondary" data-bs-dismiss="modal">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const API_BASE = "https://ecobantay-backend.onrender.com";
      const token = localStorage.getItem("staffToken");

      if (!token) {
        alert("Unauthorized. Redirecting...");
        window.location.href = "login.html";
      }

      // Load staff name
      fetch(`${API_BASE}/api/staff/profile`, {
        headers: { Authorization: `Bearer ${token}` },
      })
        .then((res) => res.json())
        .then((data) => {
          const fullName =
            data.firstName && data.lastName
              ? `${data.firstName} ${data.lastName}`
              : data.name || "Staff";
          document.getElementById("staffName").innerText = fullName;
        });

      let schedulesList = [];
      let trucksList = [];
      let driversList = [];
      let routesList = [];
      let dispatchList = [];

      async function preloadOptions() {
        const [sRes, tRes, dRes, rRes] = await Promise.all([
          fetch(`${API_BASE}/api/admin/schedules`, {
            headers: { Authorization: `Bearer ${token}` },
          }),
          fetch(`${API_BASE}/api/fleet-trucks`, {
            headers: { Authorization: `Bearer ${token}` },
          }),
          fetch(`${API_BASE}/api/admin/employees`, {
            headers: { Authorization: `Bearer ${token}` },
          }),
          fetch(`${API_BASE}/api/trucks/routes`, {
            headers: { Authorization: `Bearer ${token}` },
          }),
        ]);

        schedulesList = (await sRes.json()).schedules || [];
        trucksList = await tRes.json();
        driversList = (await dRes.json()).employees || [];
        routesList = (await rRes.json()).routes || [];

        populateCreateForm();
        populateEditForm();
      }

      function populateCreateForm() {
        document.getElementById("scheduleSelect").innerHTML =
          `<option value="" disabled selected>Select Schedule</option>` +
          schedulesList
            .map(
              (s) =>
                `<option value="${s._id}">${s.barangay} - ${s.shift}</option>`
            )
            .join("");

        document.getElementById("truckSelect").innerHTML =
          `<option value="" disabled selected>Select Truck</option>` +
          trucksList
            .map((t) => `<option value="${t._id}">${t.plateNumber}</option>`)
            .join("");

        const driverSelect = document.getElementById("driverSelect");
        driverSelect.innerHTML = `<option value="">Select Driver (optional)</option>`;
        driversList
          .filter((d) => (d.role || "").toLowerCase() === "driver")
          .forEach((d) => {
            const full =
              `${d.firstName || ""} ${d.lastName || ""}`.trim() || d.name;
            driverSelect.innerHTML += `<option value="${d._id}">${full}</option>`;
          });
      }

      function populateEditForm() {
        const s = document.getElementById("editScheduleSelect");
        const t = document.getElementById("editTruckSelect");
        const d = document.getElementById("editDriverSelect");

        s.innerHTML = schedulesList
          .map(
            (s) =>
              `<option value="${s._id}">${s.barangay} - ${s.shift}</option>`
          )
          .join("");
        t.innerHTML = trucksList
          .map((t) => `<option value="${t._id}">${t.plateNumber}</option>`)
          .join("");
        d.innerHTML = driversList
          .filter((dr) => (dr.role || "").toLowerCase() === "driver")
          .map((dr) => {
            const full =
              `${dr.firstName || ""} ${dr.lastName || ""}`.trim() || dr.name;
            return `<option value="${dr._id}">${full}</option>`;
          })
          .join("");
      }

      // Auto-fill schedule route and shift
      document
        .getElementById("scheduleSelect")
        .addEventListener("change", (e) => {
          const sched = schedulesList.find((s) => s._id === e.target.value);
          document.getElementById("shiftDisplay").value = sched?.shift || "";
          document.getElementById("routeDisplay").value = routeName(
            sched?.routeId
          );
        });

      function routeName(id) {
        const r = routesList.find((rt) => rt._id === id);
        return r ? r.name : "-";
      }

      async function loadDispatches() {
        const res = await fetch(`${API_BASE}/api/admin/dispatches`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        dispatchList = (await res.json()).dispatches || [];
        renderDispatchTable();
      }

      function renderDispatchTable() {
        const table = document.getElementById("dispatchTable");
        table.innerHTML = "";

        dispatchList.forEach((d) => {
          const sched = schedulesList.find((s) => s._id === d.scheduleId);
          const truck = trucksList.find((t) => t._id === d.truckId);
          const driver = driversList.find((dr) => dr._id === d.driverId);

          const row = `
            <tr>
              <td>${sched?.barangay || "-"}</td>
              <td>${routeName(sched?.routeId) || "-"}</td>
              <td>${truck?.plateNumber || "-"}</td>
              <td>${
                driver ? driver.firstName + " " + driver.lastName : "-"
              }</td>
              <td>${sched?.shift || "-"}</td>
              <td>${new Date(d.date).toLocaleDateString()}</td>
              <td>
                <button class="btn btn-warning btn-sm" onclick="openEdit('${
                  d._id
                }')">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteDispatch('${
                  d._id
                }')">Delete</button>
              </td>
            </tr>
          `;
          table.innerHTML += row;
        });
      }

      document
        .getElementById("createDispatchForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const formData = Object.fromEntries(new FormData(e.target));

          const selectedSchedule = schedulesList.find(
            (s) => s._id === formData.scheduleId
          );

          // Required fields from backend
          formData.shift = selectedSchedule?.shift || "";
          formData.routeId = selectedSchedule?.routeId || "";

          // Send final payload
          const res = await fetch(`${API_BASE}/api/admin/create-dispatch`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify(formData),
          });

          const json = await res.json();
          if (!json.success) {
            alert(json.message || "Missing required fields");
            return;
          }

          // Reload UI
          await loadDispatches();
          bootstrap.Modal.getInstance(
            document.getElementById("createDispatchModal")
          ).hide();
        });

      function openEdit(id) {
        const d = dispatchList.find((x) => x._id === id);
        const form = document.getElementById("editDispatchForm");

        form._id.value = d._id;
        form.scheduleId.value = d.scheduleId;
        form.truckId.value = d.truckId || "";
        form.driverId.value = d.driverId || "";
        form.date.value = d.date.split("T")[0];

        const sched = schedulesList.find((s) => s._id === d.scheduleId);
        document.getElementById("editShiftDisplay").value = sched?.shift || "";
        document.getElementById("editRouteDisplay").value = routeName(
          sched?.routeId
        );

        new bootstrap.Modal(
          document.getElementById("editDispatchModal")
        ).show();
      }

      document
        .getElementById("editDispatchForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const data = Object.fromEntries(new FormData(e.target));

          await fetch(`${API_BASE}/api/admin/edit-dispatch/${data._id}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify(data),
          });

          await loadDispatches();
          bootstrap.Modal.getInstance(
            document.getElementById("editDispatchModal")
          ).hide();
        });

      async function deleteDispatch(id) {
        if (!confirm("Delete this dispatch?")) return;

        await fetch(`${API_BASE}/api/admin/delete-dispatch/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });

        await loadDispatches();
      }

      // SEARCH
      document
        .getElementById("searchDispatch")
        .addEventListener("input", (e) => {
          const term = e.target.value.toLowerCase();

          const filtered = dispatchList.filter((d) => {
            const sched = schedulesList.find((s) => s._id === d.scheduleId);
            return (
              sched?.barangay?.toLowerCase().includes(term) ||
              routeName(sched?.routeId)?.toLowerCase().includes(term)
            );
          });

          // temporary override
          const table = document.getElementById("dispatchTable");
          table.innerHTML = "";
          filtered.forEach((d) => {
            const sched = schedulesList.find((s) => s._id === d.scheduleId);
            const truck = trucksList.find((t) => t._id === d.truckId);
            const driver = driversList.find((dr) => dr._id === d.driverId);

            table.innerHTML += `
            <tr>
              <td>${sched?.barangay || "-"}</td>
              <td>${routeName(sched?.routeId) || "-"}</td>
              <td>${truck?.plateNumber || "-"}</td>
              <td>${
                driver ? driver.firstName + " " + driver.lastName : "-"
              }</td>
              <td>${sched?.shift || "-"}</td>
              <td>${new Date(d.date).toLocaleDateString()}</td>
              <td>
                <button class="btn btn-warning btn-sm" onclick="openEdit('${
                  d._id
                }')">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteDispatch('${
                  d._id
                }')">Delete</button>
              </td>
            </tr>`;
          });
        });

      // INITIAL LOAD
      (async () => {
        await preloadOptions();
        await loadDispatches();
      })();

      // LOGOUT
      document.querySelector(".logout-btn").addEventListener("click", () => {
        localStorage.removeItem("staffToken");
        window.location.href = "login.html";
      });
    </script>
  </body>
</html>
